[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openarm-wuji-learning"
version = "0.1.0"
description = "Hardware-agnostic OpenArm + Wuji simulation, data, and policy bridge"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.26,<3"]

[tool.setuptools.packages.find]
where = ["src"]

